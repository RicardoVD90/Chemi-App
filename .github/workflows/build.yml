name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              git \
              python3 \
              python3-pip \
              python3-dev \
              autoconf \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip virtualenv setuptools
          pip install --user Cython==0.29.36 buildozer sh

      - name: Prepare and Patch python-for-android
        run: |
          rm -rf ~/.buildozer/android/platform/python-for-android
          mkdir -p ~/.buildozer/android/platform
          git clone https://github.com/kivy/python-for-android.git ~/.buildozer/android/platform/python-for-android
          
          python3 -c "
          import os
          build_py_path = os.path.expanduser('~/.buildozer/android/platform/python-for-android/pythonforandroid/build.py')
          if os.path.exists(build_py_path):
              with open(build_py_path, 'r') as f:
                  lines = f.readlines()
              new_lines = [('# ' + line if 'pip install -U pip' in line else line) for line in lines]
              with open(build_py_path, 'w') as f:
                  f.writelines(new_lines)
              print('Succesvol build.py gepatcht.')
          "

      - name: Build with Buildozer
        run: |
          export PATH=$HOME/.local/bin:$PATH
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChemieApp-APK
          path: bin/*.apk
