name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              git \
              python3 \
              python3-pip \
              python3-dev \
              autoconf \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --user Cython==0.29.36 buildozer

      - name: Fix python-for-android pip upgrade bug
        run: |
          # Map aanmaken en python-for-android handmatig klaarmaken
          mkdir -p ~/.buildozer/android/platform
          git clone https://github.com/kivy/python-for-android.git ~/.buildozer/android/platform/python-for-android
          
          # Patch de pip-installatie zodat deze een stabiele versie pakt in plaats van de kapotte nieuwste versie
          sed -i 's/pip install -U pip/pip install -U "pip<24.0"/g' ~/.buildozer/android/platform/python-for-android/pythonforandroid/build.py

      - name: Build with Buildozer
        run: |
          export PATH=$HOME/.local/bin:$PATH
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChemieApp-APK
          path: bin/*.apk
