name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              git \
              python3 \
              python3-pip \
              python3-dev \
              autoconf \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --user Cython==0.29.36 buildozer

      - name: Prepare and Patch python-for-android
        run: |
          # Zorg dat de map leeg/schoon is en kloon python-for-android handmatig
          rm -rf ~/.buildozer/android/platform/python-for-android
          mkdir -p ~/.buildozer/android/platform
          git clone https://github.com/kivy/python-for-android.git ~/.buildozer/android/platform/python-for-android
          
          # Patch build.py door alle regels met 'pip install -U pip' uit te commentariëren
          python3 -c "
          build_py_path = '/home/runner/.buildozer/android/platform/python-for-android/pythonforandroid/build.py'
          with open(build_py_path, 'r') as f:
              lines = f.readlines()
          
          new_lines = []
          for line in lines:
              if 'pip install -U pip' in line:
                  new_lines.append('# ' + line)
                  print(f'Patched line: {line.strip()}')
              else:
                  new_lines.append(line)
          
          with open(build_py_path, 'w') as f:
              f.writelines(new_lines)
          print('Successfully patched build.py to completely disable pip upgrades.')
          "

      - name: Build with Buildozer
        run: |
          export PATH=$HOME/.local/bin:$PATH
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChemieApp-APK
          path: bin/*.apk
