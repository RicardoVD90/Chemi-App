name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              git \
              python3 \
              python3-pip \
              python3-dev \
              autoconf \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install \"pip==24.3.1" \setuptools \wheel
          pip install \buildozer==1.5.0 \cython==0.29.36 \python-for-android==2024.1.21 \sh
          
      - name: Clean broken build cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.cache/pip

      - name: Build with Buildozer
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          export PATH=$HOME/.local/bin:$PATH
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChemieApp-APK
          path: bin/*.apk
